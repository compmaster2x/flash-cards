<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>flash-cards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <aside id="rememberedList" class="sidebar">
    <h2>Запомненные</h2>
    <ul id="rememberedItems"></ul>
  </aside>
  <div class="container">
    <h1 id="score">Score: </h1>
    <div id="card" class="card">
      <div class="front" id="front">Нажми, чтобы узнать ответ</div>
      <div class="back" id="back">Ответ</div>
    </div>
    <div class="buttons">
      <button id="refresh">🔄</button>
      <button id="remembered"><i class="fa-solid fa-lightbulb"></i></button>
      <button id="nextBtn">Next card </button>
    </div>
  </div>

  <script src="main.js" type="module"></script>
</body>
</html>
